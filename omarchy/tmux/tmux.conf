# Personal layer on top of Omarchy's tmux config. ~/.config/tmux/tmux.conf stays
# Omarchy's (prefix C-Space, Alt bindings, theme-following status bar, `?` help,
# `q` reload); a managed block at its end sources this file, so everything here
# wins. No theme or status-bar changes on purpose. Edit with prefix+e.

set -g history-limit 200000      # Omarchy: 50000
set -g monitor-activity on
set -g visual-activity off

# Plugins. The path is set explicitly (TPM's own default for an XDG config) so
# the CLI installer finds it without waiting for the async `run` below.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
# continuum hooks its periodic save into status-right, which Omarchy's config
# has already set by the time this file loads
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tmux-thumbs (first use compiles it with cargo)
set -g @thumbs-key g
set -g @thumbs-command 'echo -n {} | wl-copy'

# Resurrect and Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '30'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh "~npm run dev" "~pnpm dev" "~pnpm start" "~node" "~tsx" "~claude" "~codex->codex resume --last" "~lazygit" "~btop" "~htop" "~k9s" "~docker compose up"'

# Floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# FZF URL
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Session switcher
bind o run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

bind e display-popup -E -w 80% -h 80% "$EDITOR ~/.config/dotfiles/tmux/tmux.conf"

# Pane navigation and resizing (replaces Omarchy's prefix h=split, k=kill-window;
# split with v, | or -, kill a window with prefix & )
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window swap (rearrange windows left/right)
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Last-window (Tab — prefix l shadowed by select-pane -R)
bind Tab last-window

# Toggle pane synchronization (broadcast keys to all panes)
bind S setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# Kill session with confirmation (Omarchy's K kills without asking)
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Split bindings (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
