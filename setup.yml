---
# Dotfiles setup. First time: ./bootstrap.sh (installs Ansible, then runs this).
#   ansible-playbook setup.yml -K      # Linux — apt/usermod need sudo
#   ansible-playbook setup.yml         # macOS
# Tags:  --skip-tags packages | --tags desktop | --tags symlinks,fonts,tmux,secrets | --skip-tags ollama
# Verify: run it again and expect changed=0, or --check --diff.
- name: Dotfiles
  hosts: localhost
  connection: local
  vars_files:
    - brew_packages.yml # -> formulae (dict), casks (list)
  vars:
    home: "{{ ansible_env.HOME }}" # not `~`: become tasks would expand it to /root
    dotfiles: "{{ playbook_dir }}"
    backup_dir: "{{ home }}/.dotfiles_backup/{{ ansible_date_time.iso8601_basic_short }}"
    node_version: "22"
    is_omarchy: "{{ (ansible_distribution | lower) == 'omarchy' }}"
    is_legacy_platform: "{{ ansible_os_family in ['Darwin', 'Debian'] and not is_omarchy }}"
    # For the tasks that call brew/fnm/tmux: on PATH now, not just at next login.
    tool_env:
      PATH: "{{ brew_prefix }}/bin:{{ home }}/.local/bin:{{ ansible_env.PATH }}"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    # Explicit allowlist — never glob ~/.claude or ~/.codex (machine state, caches, credentials).
    dotfile_links:
      - { src: .config/ghostty, dest: .config/ghostty }
      - { src: .config/starship.toml, dest: .config/starship.toml }
      - { src: .config/atuin, dest: .config/atuin }
      - { src: .config/sheldon, dest: .config/sheldon }
      - { src: .config/yazi, dest: .config/yazi }
      - { src: .config/nvim, dest: .config/nvim }
      - { src: zsh/.zprofile, dest: .zprofile }
      - { src: zsh/.zshrc, dest: .zshrc }
      - { src: zsh/.zshrc.core, dest: .zshrc.core }
      - { src: tmux/.tmux.conf, dest: .tmux.conf }
      - { src: claude/CLAUDE.md, dest: .claude/CLAUDE.md }
      - { src: claude/AGENTS.md, dest: .claude/AGENTS.md }
      - { src: claude/settings.json, dest: .claude/settings.json }
      - { src: claude/commands, dest: .claude/commands }
      - { src: claude/skills, dest: .claude/skills }
      - { src: codex/keybindings.json, dest: .codex/keybindings.json }
      - { src: codex/AGENTS.md, dest: .codex/AGENTS.md }
      - { src: codex/instructions.md, dest: .codex/instructions.md }
      - { src: codex/rules, dest: .codex/rules }
  pre_tasks:
    - name: Require a supported platform
      ansible.builtin.assert:
        that: is_omarchy or ansible_os_family in ['Darwin', 'Debian']
        fail_msg: Only macOS, Debian-family Linux, and Omarchy are supported
        quiet: true
      tags: always

    - name: Load platform variables
      ansible.builtin.include_vars: "vars/{{ 'Omarchy' if is_omarchy else ansible_os_family }}.yml"
      tags: always

  tasks:
    - name: Omarchy adapter
      ansible.builtin.import_tasks: tasks/omarchy.yml
      when: is_omarchy
      tags: [omarchy, never]

    - name: Debian/Ubuntu packages
      ansible.builtin.import_tasks: tasks/debian.yml
      when: ansible_os_family == 'Debian' and not is_omarchy
      tags: packages

    - name: Homebrew formulae
      community.general.homebrew:
        name: "{{ brew_formulae | reject('search', '/') }}"
        state: present
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    # Tap-qualified names (cirruslabs/cli/tart) bypass the module: it fails on any stderr from
    # `brew info`, and taps print deprecation warnings. Newer brews also refuse formulae from
    # untrusted taps (tart pulls softnet from its own tap), so the tap is trusted first; the
    # `|| true` covers brews too old to have `brew trust` -- the install is the real check.
    - name: Homebrew tap formulae # ponytail: assumes the formula installs bin/<name>
      ansible.builtin.shell: >
        brew tap {{ item | dirname }} &&
        (brew trust {{ item | dirname }} 2>/dev/null || true) &&
        brew install {{ item }}
      args:
        creates: "{{ brew_prefix }}/bin/{{ item | basename }}"
      loop: "{{ brew_formulae | select('search', '/') }}"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    - name: Homebrew casks
      community.general.homebrew_cask:
        name: "{{ casks }}"
        state: present
      environment: "{{ tool_env }}"
      when: is_legacy_platform and ansible_os_family == 'Darwin'
      tags: packages

    # fnm picks its data dir itself (legacy ~/.fnm, XDG_DATA_HOME, per-OS default), so ask it
    # what is installed instead of guessing the path for `creates`. grep without -q: it must
    # drain fnm's output, or pipefail turns fnm's EPIPE panic into a bogus failure. `fnm
    # default` runs unconditionally so a drifted default gets repaired, not just fresh installs.
    - name: Node via fnm
      ansible.builtin.shell: |
        set -o pipefail
        if ! fnm ls | grep " v{{ node_version }}\." >/dev/null; then
          fnm install {{ node_version }} && echo installed
        fi
        fnm default {{ node_version }}
      args:
        executable: /bin/bash
      register: node
      changed_when: "'installed' in node.stdout"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    # Families live in subdirectories next to licences and READMEs, so recurse
    # and keep only the faces.
    - name: Font faces in repo
      ansible.builtin.find:
        paths: "{{ dotfiles }}/fonts"
        patterns: ["*.ttf", "*.otf", "*.ttc"]
        recurse: true
      register: font_faces
      when: is_legacy_platform
      tags: fonts

    # copy does not create parent dirs. No mode: ~/Library/Fonts pre-exists as 0700.
    - name: Fonts dir # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ fonts_dir }}"
        state: directory
      when: is_legacy_platform
      tags: fonts

    # Copied, not linked: macOS CoreText is unreliable about symlinked faces in ~/Library/Fonts.
    - name: Fonts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ fonts_dir }}/{{ item | basename }}"
        mode: "0644"
      loop: "{{ (font_faces.files | default([])) | map(attribute='path') | sort }}"
      loop_control:
        label: "{{ item | basename }}"
      register: fonts
      when: is_legacy_platform
      tags: fonts

    - name: Font cache (macOS picks up ~/Library/Fonts on its own)
      ansible.builtin.command: fc-cache -f {{ fonts_dir }}
      when: is_legacy_platform and ansible_os_family == 'Debian' and (fonts.changed | default(false))
      changed_when: true
      tags: fonts

    - name: Tmux plugin manager
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ home }}/.tmux/plugins/tpm"
        version: master
        update: false
      when: is_legacy_platform
      tags: tmux

    - name: Secrets file (~/.secrets, create-if-absent, sourced by .zprofile)
      ansible.builtin.copy:
        dest: "{{ home }}/.secrets"
        mode: "0600"
        force: false
        content: |
          #!/bin/bash
          # This file contains sensitive credentials and is not tracked by git
          # Generated by dotfiles setup

          export BITBUCKET_USERNAME="your.username"
          export BITBUCKET_TOKEN="your-token-here"
          export OPENAI_API_KEY="your-api-key-here"
          # Used by the codex brave-search MCP wrapper (see codex/config.example.toml)
          export BRAVE_API_KEY="your-api-key-here"

          # Add other secrets below as needed
      when: is_legacy_platform
      tags: secrets

    # copy force:false never touches an existing file, so a pre-existing
    # world-readable ~/.secrets would stay that way forever without this.
    - name: Secrets file permissions
      ansible.builtin.file:
        path: "{{ home }}/.secrets"
        mode: "0600"
      when: is_legacy_platform
      tags: secrets

    - name: Symlinks
      ansible.builtin.import_tasks: tasks/symlinks.yml
      vars:
        links: "{{ dotfile_links }}"
      when: is_legacy_platform
      tags: symlinks

    # Copy-if-absent: codex appends project trust entries at runtime, so this must not be a link.
    - name: Codex config.toml
      ansible.builtin.copy:
        src: "{{ dotfiles }}/codex/config.example.toml"
        dest: "{{ home }}/.codex/config.toml"
        mode: "0644"
        force: false
      when: is_legacy_platform
      tags: symlinks

    # tpm's installer shells out to tmux, so a configs-only run (--skip-tags
    # packages) on a box without tmux must skip, not fail.
    - name: Tmux plugins
      ansible.builtin.shell: |
        command -v tmux >/dev/null || { echo 'tmux not installed, skipping'; exit 0; }
        {{ home }}/.tmux/plugins/tpm/bin/install_plugins
      register: tpm
      changed_when: "'download success' in tpm.stdout"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: tmux

    # A launcher and global hotkeys only mean anything in a graphical session. Never
    # runs unless asked for:  ansible-playbook setup.yml -K --tags desktop
    # (desktop.yml itself asserts a graphical session — an explicit --tags desktop
    # over SSH should fail loudly, not skip every task and report success.)
    - name: Linux desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      when: ansible_os_family == 'Debian' and not is_omarchy
      tags: [desktop, never]
