---
- name: Dotfiles
  hosts: localhost
  connection: local
  vars_files:
    - brew_packages.yml
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
    dotfiles: "{{ playbook_dir }}"
    backup_dir: "{{ home }}/.dotfiles_backup/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
    node_version: "22"
    nerd_fonts: [0xProto, FiraCode, RobotoMono]
    is_wsl: "{{ ansible_facts['system'] == 'Linux' and 'microsoft' in (ansible_facts['kernel'] | lower) }}"
    is_omarchy: >-
      {{ ansible_facts['os_family'] == 'Archlinux'
         and lookup('ansible.builtin.file', '/etc/os-release', errors='ignore') is search('(?m)^ID="?omarchy"?$') }}
    is_legacy_platform: "{{ ansible_facts['os_family'] in ['Darwin', 'Debian'] and not is_omarchy }}"
    tool_env:
      PATH: "{{ brew_prefix }}/bin:{{ home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    dotfile_links:
      - { src: .config/ghostty, dest: .config/ghostty }
      - { src: .config/starship.toml, dest: .config/starship.toml }
      - { src: .config/atuin, dest: .config/atuin }
      - { src: .config/sheldon, dest: .config/sheldon }
      - { src: .config/yazi, dest: .config/yazi }
      - { src: .config/nvim, dest: .config/nvim }
      - { src: .config/herdr/config.toml, dest: .config/herdr/config.toml }
      - { src: zsh/.zprofile, dest: .zprofile }
      - { src: zsh/.zshrc, dest: .zshrc }
      - { src: zsh/.zshrc.core, dest: .zshrc.core }
      - { src: tmux/.tmux.conf, dest: .tmux.conf }
  pre_tasks:
    - name: Configure privilege escalation compatibility
      ansible.builtin.import_tasks: tasks/become.yml
      tags: always

    - name: Require a supported platform
      ansible.builtin.assert:
        that: is_omarchy or ansible_facts['os_family'] in ['Darwin', 'Debian']
        fail_msg: Only macOS, Debian-family Linux, and Omarchy are supported
        quiet: true
      tags: always

    - name: Load platform variables
      ansible.builtin.include_vars: "vars/{{ 'Omarchy' if is_omarchy else ansible_facts['os_family'] }}.yml"
      tags: always

  tasks:
    - name: WSL configuration
      ansible.builtin.import_tasks: tasks/wsl.yml
      when: is_wsl
      tags: wsl

    - name: Omarchy personal layer
      ansible.builtin.import_tasks: tasks/omarchy.yml
      when: is_omarchy

    - name: Debian/Ubuntu packages
      ansible.builtin.import_tasks: tasks/debian.yml
      when: ansible_facts['os_family'] == 'Debian' and not is_omarchy
      tags: packages

    - name: Homebrew formulae
      community.general.homebrew:
        name: "{{ brew_formulae | reject('search', '/') }}"
        state: present
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    - name: Homebrew tap formulae
      ansible.builtin.shell: >
        brew tap {{ item | dirname }} &&
        (brew trust {{ item | dirname }} 2>/dev/null || true) &&
        brew install {{ item }}
      args:
        creates: "{{ brew_prefix }}/bin/{{ item | basename }}"
      loop: "{{ brew_formulae | select('search', '/') }}"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    - name: Homebrew casks
      community.general.homebrew_cask:
        name: "{{ casks }}"
        state: present
      environment: "{{ tool_env }}"
      when: is_legacy_platform and ansible_facts['os_family'] == 'Darwin'
      tags: packages

    - name: VS Code as the default app for code and text files
      ansible.builtin.shell: |
        set -o pipefail
        command -v duti >/dev/null && [ -d "/Applications/Visual Studio Code.app" ] || exit 0
        for uti in {{ vscode_utis | join(' ') }}; do
          if [ "$(duti -d "$uti" 2>/dev/null)" != com.microsoft.VSCode ]; then
            duti -s com.microsoft.VSCode "$uti" all || exit 1
            echo "set $uti"
          fi
        done
      args:
        executable: /bin/bash
      register: vscode_defaults
      changed_when: "'set ' in vscode_defaults.stdout"
      environment: "{{ tool_env }}"
      when: is_legacy_platform and ansible_facts['os_family'] == 'Darwin'

    - name: Node via fnm
      ansible.builtin.shell: |
        set -o pipefail
        if ! fnm ls | grep " v{{ node_version }}\." >/dev/null; then
          fnm install {{ node_version }} && echo installed
        fi
        fnm default {{ node_version }}
      args:
        executable: /bin/bash
      register: node
      changed_when: "'installed' in node.stdout"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: packages

    - name: Fonts dir # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ fonts_dir }}"
        state: directory
      when: is_legacy_platform
      tags: fonts

    - name: Nerd Fonts
      ansible.builtin.unarchive:
        src: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
        dest: "{{ fonts_dir }}"
        remote_src: true
        include: ["*.ttf"]
        creates: "{{ fonts_dir }}/{{ item }}NerdFont-Regular.ttf"
      loop: "{{ nerd_fonts }}"
      register: fonts
      when: is_legacy_platform
      tags: fonts

    - name: Font cache (macOS picks up ~/Library/Fonts on its own)
      ansible.builtin.command: fc-cache -f {{ fonts_dir }}
      when: is_legacy_platform and ansible_facts['os_family'] == 'Debian' and (fonts.changed | default(false))
      changed_when: true
      tags: fonts

    - name: Tmux plugin manager
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ home }}/.tmux/plugins/tpm"
        version: master
        update: false
      when: is_legacy_platform
      tags: tmux

    - name: Secrets file (~/.secrets, create-if-absent, sourced by .zprofile / personal.bash)
      ansible.builtin.copy:
        dest: "{{ home }}/.secrets"
        mode: "0600"
        force: false
        src: "{{ playbook_dir }}/files/secrets.template"
      tags: secrets

    - name: Secrets file permissions
      ansible.builtin.file:
        path: "{{ home }}/.secrets"
        mode: "0600"
      tags: secrets

    - name: Symlinks
      ansible.builtin.import_tasks: tasks/symlinks.yml
      vars:
        links: "{{ dotfile_links }}"
      when: is_legacy_platform
      tags: symlinks

    - name: Replace retired Claude/Codex links with local copies
      ansible.builtin.command:
        argv: "{{ ['/bin/bash', dotfiles ~ '/scripts/migrate-agent-links.sh'] + (['--check'] if ansible_check_mode else []) }}"
      environment:
        HOME: "{{ home }}"
      register: agent_link_migration
      changed_when: "'changed:' in agent_link_migration.stdout"
      check_mode: false
      when: is_legacy_platform
      tags: [symlinks, herdr]

    - name: Herdr skills and integrations for installed harnesses
      ansible.builtin.command:
        argv: "{{ ['/bin/bash', dotfiles ~ '/scripts/install-herdr.sh'] + (['--check'] if ansible_check_mode else []) }}"
      environment: "{{ tool_env }}"
      register: herdr_integrations
      changed_when: "'changed:' in herdr_integrations.stdout"
      check_mode: false
      when: is_legacy_platform
      tags: herdr

    - name: Sync-worktrees CLI and MCP server
      ansible.builtin.command:
        argv: "{{ ['/bin/bash', dotfiles ~ '/scripts/install-sync-worktrees.sh'] + (['--check'] if ansible_check_mode else []) }}"
      environment: "{{ tool_env | combine({'HOME': home}) }}"
      register: sync_worktrees
      changed_when: "'changed:' in sync_worktrees.stdout"
      check_mode: false
      when: is_legacy_platform
      tags: [packages, sync-worktrees]

    - name: Tmux plugins
      ansible.builtin.shell: |
        command -v tmux >/dev/null || { echo 'tmux not installed, skipping'; exit 0; }
        {{ home }}/.tmux/plugins/tpm/bin/install_plugins
      register: tpm
      changed_when: "'download success' in tpm.stdout"
      environment: "{{ tool_env }}"
      when: is_legacy_platform
      tags: tmux

    - name: Linux desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      when: ansible_facts['os_family'] == 'Debian' and not is_omarchy
      tags: [desktop, never]
