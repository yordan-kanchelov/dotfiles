onboarding = false

[keys]
prefix = "ctrl+space"
# tmux muscle memory: tab ≈ window, workspace ≈ session.
rename_tab = "prefix+,"
close_tab = "prefix+&"
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", "prefix+\""]
rename_workspace = "prefix+$"
detach = "prefix+d"
last_pane = "prefix+;"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
goto = "prefix+s"
settings = "prefix+shift+s"

[ui.toast]
delivery = "herdr"

# Layout, pane directories, and focus are saved/restored automatically by Herdr.
# Resume each supported agent's exact conversation via its Herdr integration.
[session]
resume_agents_on_restore = true

# Match tmux-resurrect's capture-pane-contents behavior after a server restart.
# Ordinary commands (dev servers, SSH, Neovim, etc.) still need manual restart.
[experimental]
pane_history = true
