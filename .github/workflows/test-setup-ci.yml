name: Test Dotfiles Setup

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash # -eo pipefail: a failed playbook behind `| tee` must fail the step
    env:
      CI: "true"
      HOMEBREW_NO_ANALYTICS: "1"
      # The playbook's tool_env sets this for its own tasks, but bootstrap.sh's
      # `brew install ansible` runs before that and would trigger a full update.
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      # ollama: a 1.4 GB download and a user systemd the runner does not have.
      - name: Bootstrap and run the playbook
        run: ./bootstrap.sh --skip-tags ollama

      - name: Second run is a no-op
        run: |
          ansible-playbook setup.yml --skip-tags ollama | tee run2.log
          grep -E 'changed=0 ' run2.log

      - name: Smoke-test linked configs
        run: |
          ls -la ~/.zshrc ~/.zprofile ~/.zshrc.core ~/.tmux.conf ~/.config/nvim \
            ~/.claude/CLAUDE.md ~/.claude/commands ~/.codex/rules ~/.codex/config.toml
          # .zshrc.core is pulled in by a runtime `source`, so parsing .zshrc alone proves nothing about it
          zsh -n ~/.zshrc ~/.zshrc.core ~/.zprofile
          # First start bootstraps every LazyVim plugin (+ Mason, treesitter); bound it, don't fail on it.
          timeout 120 nvim --headless -c quit || echo "::warning::nvim did not exit cleanly within 120s"
          tmux -f ~/.tmux.conf list-keys >/dev/null

  # Mint is the reason several tasks branch: it reports its own codename
  # ("zena", which no PPA publishes) and keeps the Ubuntu release it derives
  # from in a separate file. No runner ships Mint, and the official container
  # turns out to report ID=ubuntu -- it carries Mint's package base, not its
  # identity -- so the identity files are written here from a real 22.3 install
  # and the resolution logic is asserted against them. That logic is the part
  # unique to Mint; the packages themselves are already covered by
  # ubuntu-latest, which shares the same noble base.
  mint:
    name: Mint release resolution
    runs-on: ubuntu-latest
    container: linuxmintd/mint22.3-amd64:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Ansible
        run: |
          apt-get update -y
          apt-get install -y ansible git ca-certificates

      - uses: actions/checkout@v4

      # After the install, so apt still sees the image's own identity.
      - name: Identify as Linux Mint 22.3
        run: |
          mkdir -p /etc/upstream-release
          cat > /etc/os-release <<'EOF'
          NAME="Linux Mint"
          VERSION="22.3 (Zena)"
          ID=linuxmint
          ID_LIKE="ubuntu debian"
          PRETTY_NAME="Linux Mint 22.3"
          VERSION_ID="22.3"
          VERSION_CODENAME=zena
          UBUNTU_CODENAME=noble
          EOF
          cat > /etc/upstream-release/lsb-release <<'EOF'
          DISTRIB_ID=Ubuntu
          DISTRIB_RELEASE=24.04
          DISTRIB_CODENAME=noble
          DISTRIB_DESCRIPTION="Ubuntu 24.04 LTS"
          EOF

      - name: Desktop tasks resolve the Ubuntu series, not Mint's
        run: ansible-playbook .github/mint-release.yml

  omarchy:
    name: Omarchy boundaries and disposable HOME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible zsh
          ansible-galaxy collection install -r requirements.yml

      - name: Static and syntax checks
        run: |
          bash tests/omarchy-boundaries.sh
          bash -n bootstrap.sh tests/omarchy-boundaries.sh tests/omarchy-integration.sh
          zsh -n omarchy/zsh/.zshrc omarchy/zsh/.zprofile omarchy/zsh/personal.zsh
          ansible-playbook setup.yml --syntax-check

      - name: Disposable-HOME integration
        run: REQUIRE_ANSIBLE=1 bash tests/omarchy-integration.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ansible/ansible-lint@main

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: "."
          ignore_paths: "zsh"
