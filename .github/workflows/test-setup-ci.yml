name: Test Dotfiles Setup

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      ANSIBLE_INJECT_FACT_VARS: "false"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Herdr and sync-worktrees installer regression checks
        run: |
          bash scripts/test-herdr.sh
          bash scripts/test-sync-worktrees.sh

      - name: Bootstrap and run the playbook
        run: ./bootstrap.sh --skip-tags ollama

      - name: Second run is a no-op
        run: |
          ansible-playbook setup.yml --skip-tags ollama | tee run2.log
          grep -E 'changed=0 ' run2.log

      - name: Smoke-test linked configs
        run: |
          ls -la ~/.zshrc ~/.zprofile ~/.zshrc.core ~/.tmux.conf ~/.config/nvim
          zsh -n ~/.zshrc ~/.zshrc.core ~/.zprofile
          perl -e 'alarm shift; exec @ARGV' 300 nvim --headless -c quit || echo "::warning::nvim did not exit cleanly within 300s"
          tmux -f ~/.tmux.conf list-keys >/dev/null
          ~/.local/bin/sync-worktrees --version

  mint:
    name: Mint release resolution
    runs-on: ubuntu-latest
    container: linuxmintd/mint22.3-amd64:latest
    defaults:
      run:
        shell: bash
    env:
      ANSIBLE_INJECT_FACT_VARS: "false"
    steps:
      - name: Ansible
        run: |
          apt-get update -y
          apt-get install -y ansible git ca-certificates

      - uses: actions/checkout@v4

      - name: Identify as Linux Mint 22.3
        run: |
          mkdir -p /etc/upstream-release
          cat > /etc/os-release <<'EOF'
          NAME="Linux Mint"
          VERSION="22.3 (Zena)"
          ID=linuxmint
          ID_LIKE="ubuntu debian"
          PRETTY_NAME="Linux Mint 22.3"
          VERSION_ID="22.3"
          VERSION_CODENAME=zena
          UBUNTU_CODENAME=noble
          EOF
          cat > /etc/upstream-release/lsb-release <<'EOF'
          DISTRIB_ID=Ubuntu
          DISTRIB_RELEASE=24.04
          DISTRIB_CODENAME=noble
          DISTRIB_DESCRIPTION="Ubuntu 24.04 LTS"
          EOF

      - name: Desktop tasks resolve the Ubuntu series, not Mint's
        run: ansible-playbook .github/mint-release.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ansible/ansible-lint@main

      - name: Verify agent sources and staging
        run: |
          python3 scripts/agent-setup-bundle.py
          python3 scripts/test-agent-setup-bundle.py

      - name: Comment ratchet
        run: |
          python3 scripts/check-comments.py
          python3 scripts/test-check-comments.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Herdr App prefix-mod key map
        run: node --test agent-setup/herdr-app/local-mods/prefix.test.mjs

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: "."
          ignore_paths: "zsh agent-setup/universal/plugins"
