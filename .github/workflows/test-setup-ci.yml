name: Test Dotfiles Setup

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash # -eo pipefail: a failed playbook behind `| tee` must fail the step
    env:
      CI: "true"
      HOMEBREW_NO_ANALYTICS: "1"
      # The playbook's tool_env sets this for its own tasks, but bootstrap.sh's
      # `brew install ansible` runs before that and would trigger a full update.
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      # ollama: a 1.4 GB download and a user systemd the runner does not have.
      - name: Bootstrap and run the playbook
        run: ./bootstrap.sh --skip-tags ollama

      - name: Second run is a no-op
        run: |
          ansible-playbook setup.yml --skip-tags ollama | tee run2.log
          grep -E 'changed=0 ' run2.log

      - name: Smoke-test linked configs
        run: |
          ls -la ~/.zshrc ~/.zprofile ~/.zshrc.core ~/.tmux.conf ~/.config/nvim \
            ~/.claude/CLAUDE.md ~/.claude/commands ~/.codex/rules ~/.codex/config.toml
          # .zshrc.core is pulled in by a runtime `source`, so parsing .zshrc alone proves nothing about it
          zsh -n ~/.zshrc ~/.zshrc.core ~/.zprofile
          # First start bootstraps every LazyVim plugin (+ Mason, treesitter); bound it, don't fail on it.
          timeout 120 nvim --headless -c quit || echo "::warning::nvim did not exit cleanly within 120s"
          tmux -f ~/.tmux.conf list-keys >/dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ansible/ansible-lint@main

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: "."
          ignore_paths: "zsh"
