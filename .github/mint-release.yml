---
- name: Mint release resolution
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Mint lands in the Debian var file under its own codename
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Linux Mint'
          - ansible_facts['os_family'] == 'Debian'
          - ansible_facts['distribution_release'] == 'zena'
        fail_msg: "got {{ ansible_facts['distribution'] }}/{{ ansible_facts['os_family'] }}/{{ ansible_facts['distribution_release'] }}"
        quiet: true

    - name: Ulauncher PPA codename
      ansible.builtin.assert:
        that: codename == 'noble'
        fail_msg: "UBUNTU_CODENAME resolved to '{{ codename }}', not noble"
        quiet: true
      vars:
        codename: "{{ lookup('ansible.builtin.ini', 'UBUNTU_CODENAME', type='properties', file='/etc/os-release') }}"

    - name: Ghostty .deb release
      ansible.builtin.assert:
        that: release == '24.04'
        fail_msg: "release resolved to '{{ release }}', not 24.04"
        quiet: true
      vars:
        release: >-
          {{ ansible_facts['distribution_release'] if ansible_facts['distribution'] == 'Debian'
             else (lookup('ansible.builtin.ini', 'DISTRIB_RELEASE', type='properties',
                          file='/etc/upstream-release/lsb-release', errors='ignore')
                   or ansible_facts['distribution_version']) }}
