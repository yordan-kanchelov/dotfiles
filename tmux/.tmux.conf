set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-features ',xterm-256color:RGB'

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1         # start indexing panes at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 200000      # override tmux-sensible default (50000); 1M was overkill and amplifies resurrect saves
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -gq allow-passthrough on     # let yazi/kitty graphics escape sequences through
set -g status-position top       # macOS / darwin style
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
setw -g mode-keys vi
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'omerxx/tmux-floax'
# resurrect & continuum must load after catppuccin, otherwise the theme
# overwrites the status-right interpolation that continuum uses to trigger
# periodic saves
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tmux-thumbs configuration
set -g @thumbs-key g
set -g @thumbs-command 'echo -n {} | pbcopy'

# Resurrect and Continuum configuration
set -g @continuum-restore 'on'        # Auto-restore on tmux start
set -g @continuum-save-interval '30'  # Save every 30 minutes
set -g @resurrect-strategy-nvim 'session'  # Restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh "~npm run dev" "~pnpm dev" "~pnpm start" "~node" "~tsx" "~claude" "~codex->codex resume --last" "~lazygit" "~btop" "~htop" "~k9s" "~docker compose up"'

# Floax configuration
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# Session management
# Use tmux-fzf session switch directly (sessionx doesn't work with Ghostty)
bind-key o run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"


# FZF URL
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Catppuccin theme (v2)
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# Status line format (continuum appends its hook after plugin load)
set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#[fg=#181926,bg=#eed49f] CPU #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) "
set -ag status-right "#[fg=#181926,bg=#a6da95] RAM #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) "
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Key bindings (must be before TPM initialization)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded 🚨"
bind e display-popup -E -w 80% -h 80% "$EDITOR ~/.tmux.conf"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window swap (rearrange windows left/right)
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Last-window (Tab — prefix l shadowed by select-pane -R)
bind Tab last-window

# Toggle pane synchronization (broadcast keys to all panes)
bind S setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# Kill session with confirmation
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Split bindings (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window preserves current path
bind c new-window -c "#{pane_current_path}"

# Enhanced vi copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# Initialize TPM (keep at bottom)
run '$HOME/.tmux/plugins/tpm/tpm'
