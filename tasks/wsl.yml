---
- name: Require a normal Linux user for WSL setup
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['user_id'] != 'root'
    fail_msg: Launch the WSL distribution and finish creating your normal Linux user before running bootstrap.sh

# Preserve automount/network/interop settings rather than replacing wsl.conf.
- name: WSL systemd and default user
  community.general.ini_file:
    path: /etc/wsl.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { section: boot, option: systemd, value: "true" }
    - { section: user, option: default, value: "{{ ansible_facts['user_id'] }}" }
  become: true
  register: wsl_config

- name: WSL configuration notice
  ansible.builtin.debug:
    msg: >-
      {{ 'WSL settings changed. After setup finishes, close the distribution and run wsl --terminate '
         ~ ansible_facts['env']['WSL_DISTRO_NAME'] | default('Ubuntu') ~ ' from Windows to apply them.'
         if wsl_config.changed else 'WSL systemd and default user are already configured.' }}
