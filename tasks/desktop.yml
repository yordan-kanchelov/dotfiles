---
# Linux desktop: Ulauncher, Ghostty, Flameshot, Bitwarden, draw.io, Cinnamon
# settings, xbindkeys, xremap.
# Only reached via --tags desktop (see setup.yml). Failing loudly beats the
# alternative — every task silently skipping on an SSH run that asked for
# desktop by name.
- name: Graphical session required
  ansible.builtin.assert:
    that: ansible_env.XDG_CURRENT_DESKTOP is defined
    fail_msg: --tags desktop needs a graphical session; run it from the desktop, not SSH/cron
    quiet: true

- name: Installed packages
  ansible.builtin.package_facts:

# Mint reports its own codename (zena); the PPA only has Ubuntu series, so pass
# the base one explicitly.
- name: Ulauncher PPA
  ansible.builtin.apt_repository:
    repo: ppa:agornostal/ulauncher
    codename: "{{ lookup('ansible.builtin.ini', 'UBUNTU_CODENAME', type='properties', file='/etc/os-release') }}"
  become: true
  when: ansible_distribution != 'Debian' and 'ulauncher' not in ansible_facts.packages

# rofi: Cinnamon has no per-app window overview, so App Exposé is rofi's window
# mode filtered to one WM_CLASS (xbindkeys/app-expose). wmctrl: xbindkeys/tile
# moves windows through EWMH messages. x11-utils: those scripts also shell out
# to xprop/xwininfo, which cinnamon-core does not guarantee.
- name: Desktop packages
  ansible.builtin.apt:
    name: [ulauncher, flameshot, xbindkeys, rofi, unzip, wmctrl, x11-utils]
  become: true

# Ghostty reached the Ubuntu archive in 26.04. Older bases (Mint 22 sits on
# 24.04) have no apt candidate and upstream ships no binaries, so fall back to
# the community .deb builds, which name Ubuntu assets by version ("24.04") and
# Debian ones by codename, and spell the version ".ppaN" where the tag says "-ppaN".
- name: Ghostty
  when: "'ghostty' not in ansible_facts.packages"
  vars:
    # Not `'(none)' not in stdout`: apt-cache policy prints "Installed: (none)"
    # for any not-installed package, and this block only runs for those.
    ghostty_in_apt: "{{ 'Candidate:' in ghostty_policy.stdout and 'Candidate: (none)' not in ghostty_policy.stdout }}"
  block:
    # check_mode: false on the read-only probes: --check skips them otherwise,
    # and the when-clauses below dereference their results.
    - name: Ghostty apt candidate
      ansible.builtin.command: apt-cache policy ghostty
      register: ghostty_policy
      changed_when: false
      check_mode: false

    - name: Ghostty from apt
      ansible.builtin.apt:
        name: ghostty
      become: true
      when: ghostty_in_apt

    - name: Ghostty latest community release
      ansible.builtin.uri:
        url: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
        return_content: true
      register: ghostty_latest
      when: not ghostty_in_apt
      check_mode: false

    - name: Ghostty community .deb
      ansible.builtin.apt:
        deb: "{{ ghostty_downloads }}/{{ tag }}/ghostty_{{ tag | replace('-ppa', '.ppa') }}_{{ deb_arch }}_{{ release }}.deb"
      vars:
        ghostty_downloads: https://github.com/mkasberg/ghostty-ubuntu/releases/download
        tag: "{{ ghostty_latest.json.tag_name }}"
        release: >-
          {{ ansible_distribution_release if ansible_distribution == 'Debian'
             else (lookup('ansible.builtin.ini', 'DISTRIB_RELEASE', type='properties',
                          file='/etc/upstream-release/lsb-release', errors='ignore')
                   or ansible_distribution_version) }}
      become: true
      when: not ghostty_in_apt

# Neither ships an apt repo, so both come from an upstream .deb. Gated on
# package_facts: the URLs always serve the current build, so an ungated task
# would re-download on every run and reinstall whenever upstream moved.
- name: Bitwarden
  ansible.builtin.apt:
    # /download redirects to the current versioned .deb; there is no stable URL
    # to pin. apt follows the redirect itself, and dpkg reads the file's
    # contents rather than its name, so the query string costs nothing.
    deb: https://vault.bitwarden.com/download/?app=desktop&platform=linux
  become: true
  # "bitwarden", not "Bitwarden": the desktop app is @bitwarden/desktop, so
  # electron-builder falls back to the product name and fpm downcases it.
  when: "'bitwarden' not in ansible_facts.packages"

# Upstream publishes no "latest" asset URL, so resolve the release first, the
# same way Ghostty's community .deb is resolved above.
- name: Drawio
  when: "'draw.io' not in ansible_facts.packages" # package.json name, not the "drawio" the assets carry
  block:
    - name: Drawio latest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/jgraph/drawio-desktop/releases/latest
        return_content: true
      register: drawio_latest
      check_mode: false

    # Pick the asset instead of rebuilding its name from the tag: the release
    # also carries an .AppImage and an .rpm, so match the arch and the suffix.
    - name: Drawio .deb
      ansible.builtin.apt:
        deb: "{{ drawio_latest.json.assets | map(attribute='browser_download_url') | select('search', 'drawio-' ~ deb_arch ~ '-.*\\.deb$') | first }}"
      become: true

- name: Autostart dir # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ home }}/.config/autostart"
    state: directory

# Super is the MX Mechanical key in the macOS Command position. A whole-key
# swap would turn terminal copy into SIGINT and would destroy Cinnamon's Super
# shortcuts, so xremap translates only an exact allowlist and can special-case
# terminal windows. Limit capture to the MX keyboard: the laptop/other keyboards
# retain normal Linux semantics. Running as the desktop user avoids a root-owned
# process connecting to X11, but requires the input group and uinput access. The
# new group is picked up at the next login, when the autostart entry first runs.
- name: Xremap
  when:
    - "'cinnamon' in (ansible_env.XDG_CURRENT_DESKTOP | lower)"
    - (ansible_env.XDG_SESSION_TYPE | default('')) == 'x11'
  vars:
    xremap_version: 0.15.11
    xremap_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64', 'arm64': 'aarch64'}.get(ansible_architecture, ansible_architecture) }}"
    xremap_archive: "{{ home }}/.cache/xremap-{{ xremap_version }}-{{ xremap_arch }}-x11.zip"
    xremap_checksums:
      x86_64: 2e83a3befde38747087cc740492a4af73feb3a5a3705fbdc71a48ec916601723
      aarch64: 4593ec9ea7ca6ec9472254bbc6a7551f77ba8daec01986c6b3a4d7534d9da7f1
    xremap_binary_checksums:
      x86_64: ddbf3a43623d10b3bf6f4737fc3ebb8c49b9882b5b4920eba084f0aacc8a025c
      aarch64: bf580a96c73efb38dfc79b947dfc514c22e7bf62c403b7b29c3baa010d3fe8ff
  block:
    - name: Xremap architecture supported
      ansible.builtin.assert:
        that:
          - xremap_arch in xremap_checksums
          - xremap_arch in xremap_binary_checksums
        fail_msg: "No pinned xremap binary for architecture {{ ansible_architecture }}"
        quiet: true

    - name: Xremap installed binary
      ansible.builtin.stat:
        path: "{{ home }}/.local/bin/xremap"
        checksum_algorithm: sha256
      register: xremap_binary
      check_mode: false

    - name: Xremap directories # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ home }}/.cache"
        - "{{ home }}/.local/bin"

    - name: Xremap archive
      ansible.builtin.get_url:
        url: "https://github.com/xremap/xremap/releases/download/v{{ xremap_version }}/xremap-linux-{{ xremap_arch }}-x11.zip"
        dest: "{{ xremap_archive }}"
        checksum: "sha256:{{ xremap_checksums[xremap_arch] }}"
        mode: "0644"
      when: >-
        not (xremap_binary.stat.isreg | default(false))
        or (xremap_binary.stat.checksum | default('')) != xremap_binary_checksums[xremap_arch]

    - name: Invalid xremap binary path absent
      ansible.builtin.file:
        path: "{{ home }}/.local/bin/xremap"
        state: absent
      when:
        - xremap_binary.stat.exists
        - not (xremap_binary.stat.isreg | default(false))

    - name: Xremap binary
      ansible.builtin.unarchive:
        src: "{{ xremap_archive }}"
        dest: "{{ home }}/.local/bin"
        remote_src: true
      when:
        - not (xremap_binary.stat.isreg | default(false)) or (xremap_binary.stat.checksum | default('')) != xremap_binary_checksums[xremap_arch]
        - not ansible_check_mode

    # SHA-256 does not cover mode bits. Enforce executable-mode drift on existing
    # binaries, but skip a nonexistent path during fresh-machine check mode.
    - name: Xremap binary executable
      ansible.builtin.file:
        path: "{{ home }}/.local/bin/xremap"
        mode: "0755"
      when:
        - not ansible_check_mode or (xremap_binary.stat.isreg | default(false))

    # Reading event devices is equivalent to keylogger access. Keep this explicit
    # rather than hiding it in a privileged service or running xremap as root.
    - name: Input group
      ansible.builtin.group:
        name: input
        system: true
      become: true

    - name: Input group membership
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: input
        append: true
      become: true

    - name: Uinput module at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/xremap-uinput.conf
        owner: root
        group: root
        mode: "0644"
        content: "uinput\n"
      become: true

    # Converge live state too: a no-change run must repair an unloaded module.
    - name: Uinput module loaded
      community.general.modprobe:
        name: uinput
        state: present
      become: true

    - name: Uinput access for input group
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-xremap-uinput.rules
        owner: root
        group: root
        mode: "0644"
        content: |
          KERNEL=="uinput", GROUP="input", MODE:="0660", OPTIONS+="static_node=uinput"
      become: true

    # Reload and trigger on every normal run so unchanged files can still repair
    # daemon/runtime drift. Both commands are idempotent from Ansible's view.
    - name: Udev rules loaded
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true

    - name: Uinput permissions applied
      ansible.builtin.command: udevadm trigger --action=change --name-match=uinput
      changed_when: false
      become: true

    - name: Xremap config link
      ansible.builtin.import_tasks: symlinks.yml
      vars:
        links:
          - { src: xremap, dest: .config/xremap }

    - name: Xremap autostart
      ansible.builtin.copy:
        dest: "{{ home }}/.config/autostart/xremap.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=xremap
          TryExec={{ home }}/.local/bin/xremap
          Exec={{ home }}/.config/xremap/start
          X-GNOME-Autostart-enabled=true
          NoDisplay=true

    - name: Xremap supervisor running
      ansible.builtin.shell: |
        pidfile="{{ home }}/.cache/xremap-supervisor.pid"
        [ -r "$pidfile" ] && kill -0 "$(cat "$pidfile")" 2>/dev/null
        cmdline=$(tr '\0' ' ' < "/proc/$(cat "$pidfile")/cmdline")
        case "$cmdline" in *"{{ home }}/.config/xremap/start"*) exit 0;; *) exit 1;; esac
      register: xremap_pgrep
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Effective input group membership
      ansible.builtin.command: id -nG
      register: effective_groups
      changed_when: false
      check_mode: false

    - name: Stop legacy directly launched xremap
      ansible.builtin.shell: |
        binary="{{ home }}/.local/bin/xremap"
        config="{{ home }}/.config/xremap/config.yml"
        changed=false
        for pid in $(pgrep -u "$(id -u)" -x xremap || true); do
          cmdline=$(tr '\0' ' ' < "/proc/$pid/cmdline")
          case "$cmdline" in
            "$binary"*"$config"*)
              kill "$pid"
              changed=true
              for _ in 1 2 3 4 5; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.2
              done
              kill -0 "$pid" 2>/dev/null && exit 1
              ;;
          esac
        done
        $changed && echo changed
        exit 0
      register: legacy_xremap
      changed_when: "'changed' in legacy_xremap.stdout"
      when: xremap_pgrep.rc != 0

    - name: Start xremap
      ansible.builtin.shell: >-
        setsid "{{ home }}/.config/xremap/start"
        >"{{ home }}/.cache/xremap.log" 2>&1 &
      changed_when: true
      when:
        - xremap_pgrep.rc != 0
        - "'input' in effective_groups.stdout.split()"

    - name: Xremap supervisor alive
      ansible.builtin.shell: |
        pidfile="{{ home }}/.cache/xremap-supervisor.pid"
        [ -r "$pidfile" ] && kill -0 "$(cat "$pidfile")" 2>/dev/null
        cmdline=$(tr '\0' ' ' < "/proc/$(cat "$pidfile")/cmdline")
        case "$cmdline" in *"{{ home }}/.config/xremap/start"*) exit 0;; *) exit 1;; esac
      register: xremap_alive
      until: xremap_alive.rc == 0
      retries: 5
      delay: 1
      changed_when: false
      when: "'input' in effective_groups.stdout.split()"

# The hotkey is useless without a live daemon; neither the autostart entry nor
# starting it needs root.
- name: Ulauncher autostart
  ansible.builtin.copy:
    dest: "{{ home }}/.config/autostart/ulauncher.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Ulauncher
      Exec=ulauncher --hide-window
      Icon=ulauncher
      X-GNOME-Autostart-enabled=true

# -x matches the process name exactly; -f would match this very play's command line.
- name: Ulauncher running
  ansible.builtin.command: pgrep -x ulauncher
  register: ulauncher_pgrep
  changed_when: false
  failed_when: false
  check_mode: false

- name: Start Ulauncher
  ansible.builtin.shell: setsid ulauncher --hide-window >/dev/null 2>&1 &
  changed_when: true
  when: ulauncher_pgrep.rc != 0

# The spawn discards output and backgrounds, so it succeeds even when the
# daemon dies on startup; only pgrep proves it came up (same as xbindkeys).
- name: Ulauncher alive
  ansible.builtin.command: pgrep -x ulauncher
  register: ulauncher_alive
  until: ulauncher_alive.rc == 0
  retries: 5
  delay: 1
  changed_when: false
  when: ulauncher_pgrep.rc != 0

- name: Cinnamon settings
  when: "'cinnamon' in (ansible_env.XDG_CURRENT_DESKTOP | lower)"
  block:
    # Keep US as the primary layout and add Bulgarian's traditional phonetic
    # variant. Cinnamon handles layout switching itself; the matching WM
    # keybindings preserve the hardware keyboard key and add
    # Ctrl+Super+Space / Ctrl+Shift+Super+Space switching explicitly.
    - name: Keyboard layouts and input switching
      ansible.builtin.shell: |
        set -e
        current=$(gsettings get {{ item.schema }} {{ item.key }})
        desired="{{ item.value }}"
        if [ "$current" != "$desired" ]; then
          gsettings set {{ item.schema }} {{ item.key }} "$desired"
          echo changed
        fi
      args:
        executable: /bin/bash
      loop:
        - schema: org.cinnamon.desktop.input-sources
          key: sources
          value: "[('xkb', 'us'), ('xkb', 'bg+phonetic')]"
        - schema: org.cinnamon.desktop.keybindings.wm
          key: switch-input-source
          value: "['<Control><Super>space', 'XF86Keyboard']"
        - schema: org.cinnamon.desktop.keybindings.wm
          key: switch-input-source-backward
          value: "['<Control><Shift><Super>space', '<Shift>XF86Keyboard']"
      loop_control:
        label: "{{ item.schema }} {{ item.key }}"
      register: keyboard_input
      changed_when: "'changed' in keyboard_input.stdout"

    - name: Hot corners (current)
      ansible.builtin.command: gsettings get org.cinnamon hotcorner-layout
      register: hotcorners
      changed_when: false
      check_mode: false

    # expo = Mission Control, scale = App Exposé. Only touched while every corner
    # is still off, so a hand-tuned layout survives a re-run.
    - name: Hot corners (top-left Expo, top-right App Exposé)
      ansible.builtin.command: >
        gsettings set org.cinnamon hotcorner-layout
        "['expo:true:0', 'scale:true:0', 'scale:false:0', 'desktop:false:0']"
      when: "':true:' not in hotcorners.stdout"
      changed_when: true

    # Cinnamon ships Alt+Space on the window menu; the launcher never sees the key
    # until that one is cleared. Remove just that element — wiping the whole list
    # would take any other binding (e.g. the Menu key) down with it.
    - name: Free Alt+Space from the window menu
      ansible.builtin.shell: |
        set -e -o pipefail
        cur=$(gsettings get org.cinnamon.desktop.keybindings.wm activate-window-menu)
        if [[ $cur == *"'<Alt>space'"* ]]; then
          new=$(printf '%s' "$cur" | sed "s/'<Alt>space', //; s/, '<Alt>space'//; s/'<Alt>space'//")
          gsettings set org.cinnamon.desktop.keybindings.wm activate-window-menu "$new" && echo changed
        fi
      args:
        executable: /bin/bash
      register: window_menu
      changed_when: "'changed' in window_menu.stdout"

    # These four defaults overlap common Command shortcuts (location, open,
    # print and save). Keep the Cinnamon actions available one chord higher;
    # xremap uses exact matching, so Ctrl+Super passes through untouched.
    - name: Move conflicting Cinnamon Super shortcuts to Ctrl+Super
      ansible.builtin.shell: |
        set -e -o pipefail
        cur=$(gsettings get {{ item.schema }} {{ item.key }})
        if [[ $cur == *"'<Super>{{ item.letter }}'"* ]]; then
          new=$(printf '%s' "$cur" | sed "s/'<Super>{{ item.letter }}'/'<Control><Super>{{ item.letter }}'/")
          gsettings set {{ item.schema }} {{ item.key }} "$new"
          echo changed
        fi
      args:
        executable: /bin/bash
      loop:
        - { schema: org.cinnamon.desktop.keybindings, key: looking-glass-keybinding, letter: l }
        - { schema: org.cinnamon.desktop.keybindings, key: show-desklets, letter: s }
        - { schema: org.cinnamon.desktop.keybindings.media-keys, key: video-rotation-lock, letter: o }
        - { schema: org.cinnamon.desktop.keybindings.wm, key: switch-monitor, letter: p }
      loop_control:
        label: "Super+{{ item.letter | upper }} -> Ctrl+Super+{{ item.letter | upper }}"
      register: cinnamon_super_shortcuts
      changed_when: "'changed' in cinnamon_super_shortcuts.stdout"
      when: (ansible_env.XDG_SESSION_TYPE | default('')) == 'x11'

    # Cinnamon keeps custom shortcuts as custom0/custom1/... under a relocatable
    # schema plus a list naming the live ones. Reuse the slot already holding
    # this command, or re-runs stack duplicates. Fill the slot before advertising
    # it in custom-list, or a failure in between leaves a blank shortcut nothing
    # can reclaim. Super sits where Cmd does, so Shift+Super+4 becomes
    # Cmd+Shift+4 under a Mac-style remapper and is harmless before that.
    # set -e: without it a failed `gsettings set` would fall through to `echo
    # changed` and report success while nothing was written.
    - name: Custom hotkeys
      ansible.builtin.shell: |
        set -e -o pipefail
        schema() { echo "org.cinnamon.desktop.keybindings.custom-keybinding:/org/cinnamon/desktop/keybindings/custom-keybindings/$1/"; }
        list=$(gsettings get org.cinnamon.desktop.keybindings custom-list)
        slots=$(echo "$list" | grep -o "'[^']*'" | tr -d "'" || true)
        slot=
        for s in $slots; do
          [ "$(gsettings get "$(schema "$s")" command)" = "'{{ item.command }}'" ] && { slot=$s; break; }
        done
        if [ -z "$slot" ]; then
          i=0; while echo "$slots" | grep -qx "custom$i"; do i=$((i + 1)); done
          slot=custom$i
        elif [ "$(gsettings get "$(schema "$slot")" binding)" = "['{{ item.binding }}']" ] &&
             [ "$(gsettings get "$(schema "$slot")" name)" = "'{{ item.name }}'" ]; then
          exit 0
        fi
        gsettings set "$(schema "$slot")" name "'{{ item.name }}'"
        gsettings set "$(schema "$slot")" command "'{{ item.command }}'"
        gsettings set "$(schema "$slot")" binding "['{{ item.binding }}']"
        if ! echo "$list" | grep -q "'$slot'"; then
          gsettings set org.cinnamon.desktop.keybindings custom-list "[$(printf "'%s', " $slots "$slot" | sed 's/, $//')]"
        fi
        echo changed
      args:
        executable: /bin/bash
      loop:
        - { name: Ulauncher, command: ulauncher-toggle, binding: "<Alt>space" }
        - { name: Flameshot, command: flameshot gui, binding: "<Shift><Super>4" }
      loop_control:
        label: "{{ item.binding }} -> {{ item.command }}"
      register: hotkey
      changed_when: "'changed' in hotkey.stdout"

# Cinnamon's keyboard panel only accepts key combos, so the mouse side buttons
# (X numbers them 8/9) need xbindkeys holding a grab on them. Under Wayland it
# starts, binds nothing and reports success — worse than not running at all.
- name: Xbindkeys
  when: >-
    'cinnamon' in (ansible_env.XDG_CURRENT_DESKTOP | lower)
    and (ansible_env.XDG_SESSION_TYPE | default('')) != 'wayland'
  block:
    - name: Xbindkeys links
      ansible.builtin.import_tasks: symlinks.yml
      vars:
        links:
          - { src: xbindkeys/.xbindkeysrc, dest: .xbindkeysrc }
          - { src: xbindkeys/app-expose, dest: .local/bin/app-expose }
          - { src: xbindkeys/mission-control, dest: .local/bin/mission-control }
          - { src: xbindkeys/tile, dest: .local/bin/tile }

    - name: Xbindkeys autostart
      ansible.builtin.copy:
        dest: "{{ home }}/.config/autostart/xbindkeys.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=xbindkeys
          Exec=xbindkeys
          X-GNOME-Autostart-enabled=true
          NoDisplay=true

    # Unconditional: xbindkeys reads ~/.xbindkeysrc once at startup, so a leftover
    # instance keeps serving stale bindings. pkill returns once the signal is
    # sent, not once the process is gone — spawn into the old instance's live
    # grabs and the new one comes up bound to nothing.
    - name: Restart xbindkeys
      ansible.builtin.shell: |
        pkill -x xbindkeys || true
        timeout 5 sh -c 'while pgrep -x xbindkeys >/dev/null; do sleep 0.1; done'
        setsid xbindkeys >/dev/null 2>&1 &
      changed_when: true

    # xbindkeys exits on a config it cannot parse, and its output is discarded
    # above, so spawning it proves nothing on its own.
    - name: Xbindkeys alive
      ansible.builtin.command: pgrep -x xbindkeys
      register: xbindkeys_pgrep
      until: xbindkeys_pgrep.rc == 0
      retries: 5
      delay: 1
      changed_when: false
