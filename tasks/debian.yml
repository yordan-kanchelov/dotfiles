---
- name: Apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Zsh as login shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ zsh_path }}"
  become: true

- name: Linuxbrew prefix owned by user
  ansible.builtin.file:
    path: "{{ brew_prefix }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"
  become: true

- name: Homebrew
  ansible.builtin.shell: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: "{{ brew_prefix }}/bin/brew"

- name: Ollama dirs # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ home }}/.local/bin"
    - "{{ home }}/.local/ollama"
    - "{{ home }}/.config/systemd/user"
  tags: ollama

- name: Ollama upstream build
  ansible.builtin.unarchive:
    src: "https://github.com/ollama/ollama/releases/latest/download/ollama-linux-{{ deb_arch }}.tar.zst"
    dest: "{{ home }}/.local/ollama"
    remote_src: true
    creates: "{{ home }}/.local/ollama/bin/ollama"
  tags: ollama

- name: Ollama on PATH
  ansible.builtin.file:
    src: "{{ home }}/.local/ollama/bin/ollama"
    dest: "{{ home }}/.local/bin/ollama"
    state: link
    force: true
  tags: ollama

- name: Ollama user unit
  ansible.builtin.copy:
    dest: "{{ home }}/.config/systemd/user/ollama.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Ollama
      After=network-online.target

      [Service]
      ExecStart={{ home }}/.local/ollama/bin/ollama serve
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=default.target
  register: ollama_unit
  tags: ollama

- name: Ollama service
  ansible.builtin.systemd_service:
    name: ollama
    scope: user
    enabled: true
    state: "{{ 'restarted' if ollama_unit.changed else 'started' }}"
    daemon_reload: true
  when: ansible_facts['service_mgr'] == 'systemd' and ansible_facts['env']['XDG_RUNTIME_DIR'] is defined
  tags: ollama
