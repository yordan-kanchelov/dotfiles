[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-headroom-rtk"
version = "0.1.0"
description = "Local RTK command-output estimates alongside Headroom metrics"
requires-python = ">=3.13"
dependencies = ["headroom-ai==0.42.0"]

[project.entry-points."headroom.proxy_extension"]
dotfiles-rtk = "headroom_rtk.extension:install"

[tool.setuptools.package-data]
headroom_rtk = ["panel.js"]

[tool.setuptools.packages.find]
include = ["headroom_rtk*"]
